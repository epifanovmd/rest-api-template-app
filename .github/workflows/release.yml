name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Релиз — только из main: помеченный коммит должен входить в main.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Тег поставлен на коммит из main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Тег $GITHUB_REF_NAME стоит не на коммите из main"
            exit 1
          }

  image:
    needs: on-main
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Полный образ (с ffmpeg): worker, migrate, любая роль.
          - target: worker
            suffix: ""
          # Облегчённый образ API без ffmpeg.
          - target: api
            suffix: "-api"
          # Агент: Go + Python-нагрузки (Dockerfile.agent).
          - target: ""
            file: Dockerfile.agent
            suffix: "-agent"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file || 'Dockerfile' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          # Подпись сборок агента для самообновления (agent keygen → секрет репозитория).
          secrets: |
            agent_signing_key=${{ secrets.AGENT_SIGNING_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          provenance: true
          cache-from: type=gha,scope=release${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release${{ matrix.suffix }}
