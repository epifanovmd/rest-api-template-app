# Агент для разработки (yarn agent): ${…} подставляет scripts/agent-dev.sh.
server:
  url: http://localhost:${SERVER_PORT}
dataDir: ${AGENT_ROOT}/.agent/data
name: dev-${USER}
labels:
  env: dev
enroll:
  token: ${AGENT_BOOTSTRAP_TOKEN}
update:
  mode: disabled
log:
  level: info
workloads:
  - name: echo
    command: ["${AGENT_ROOT}/.venv/bin/python", "-m", "examples.echo_worker"]
    dir: ${AGENT_ROOT}/python
    stopTimeout: 30s
