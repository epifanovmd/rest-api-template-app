# Агент в контейнере (Dockerfile.agent). Адрес API — AGENT_SERVER_URL, токен
# регистрации — AGENT_ENROLL_TOKEN, имя — AGENT_NAME (по умолчанию hostname).
server:
  url: ${AGENT_SERVER_URL}
dataDir: /var/lib/agent
update:
  mode: external
log:
  level: ${AGENT_LOG_LEVEL}
  format: json
workloads:
  - name: echo
    command: ["python", "-m", "examples.echo_worker"]
    dir: /app
    stopTimeout: 60s
