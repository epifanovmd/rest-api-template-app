# Агент в контейнере (docker/Dockerfile): поверх agent.prod.yaml. Адрес API — AGENT_SERVER_URL,
# токен — AGENT_ENROLL_TOKEN, данные — том /var/lib/agent. Себя не обновляет: обновляют образ.
extends: agent.prod.yaml
dataDir: /var/lib/agent
update:
  mode: external
workers:
  - path: workers/echo
    env:
      WORKER_STATE_DIR: /var/lib/agent/echo-state
