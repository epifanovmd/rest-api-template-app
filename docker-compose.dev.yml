# Локальная инфраструктура для `yarn dev` и e2e: Postgres, Redis, Mailpit (SMTP)
# и S3 (SeaweedFS) с bucket-ами.
#   yarn services:up      (= docker compose -f docker-compose.dev.yml up -d --wait)
#   yarn services:down
# Порты — не стандартные (5433, 6380, 8334, 1026/8026): стек работает рядом с другими
# Postgres/Redis/S3 на этой машине. Другие — POSTGRES_PORT, REDIS_PORT, S3_PORT, SMTP_PORT,
# MAILPIT_UI_PORT в окружении (и те же порты в .env.development).
# S3: S3_ENDPOINT=http://localhost:8334 S3_FORCE_PATH_STYLE=true S3_BUCKET=rest-api
#   S3_ACCESS_KEY_ID=storage S3_SECRET_ACCESS_KEY=storage12345
name: rest-api-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rest_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Тестовый SMTP: письма не уходят наружу, смотреть — http://localhost:8026
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"

  # S3 API — http://localhost:8334 (storage / storage12345)
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-volume.max=0"]
    environment:
      AWS_ACCESS_KEY_ID: storage
      AWS_SECRET_ACCESS_KEY: storage12345
    ports:
      - "127.0.0.1:${S3_PORT:-8334}:8333"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Bucket приложения и e2e (идемпотентно). Повторы: S3 API поднимается позже, чем
  # healthcheck мастера SeaweedFS.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: storage
      AWS_SECRET_ACCESS_KEY: storage12345
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for b in rest-api e2e; do i=0;
        until aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$b" 2>/dev/null ||
        aws --endpoint-url http://s3:8333 s3 mb "s3://$$b"; do
        i=$$((i+1)); [ $$i -lt 30 ] || exit 1; sleep 2; done; done
    restart: "no"

volumes:
  postgres:
  s3:
