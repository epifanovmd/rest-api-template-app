# S3-совместимое хранилище (SeaweedFS) в составе стека. Подключается к docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.s3.yml
# Внешний S3 (AWS, Yandex, Selectel) — S3_ENDPOINT/S3_* в .env.production;
# локальный диск — STORAGE_DRIVER=local.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Приложение — после создания bucket.
  api:
    depends_on:
      s3-init:
        condition: service_completed_successfully
  worker:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  # S3-совместимое хранилище (SeaweedFS). Внешний S3 (AWS, Yandex, Selectel):
  # задать S3_ENDPOINT/S3_* и убрать сервисы s3 и s3-init.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-volume.max=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_ACCESS_KEY:-storage}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_KEY:?S3_ROOT_SECRET_KEY is required}
    ports:
      - "${S3_PORTS:-8333}:8333"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
    logging: *logging

  # Одноразовый: создаёт bucket (идемпотентно).
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_ACCESS_KEY:-storage}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_KEY:?S3_ROOT_SECRET_KEY is required}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-rest-api}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

volumes:
  s3:
