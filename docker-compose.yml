# Production-стек: api (масштабируемый) + worker + одноразовый migrate, Redis.
# Postgres и S3 (SeaweedFS) — отдельными файлами, подключаются при необходимости:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml:docker-compose.s3.yml
# Образы — из registry или сборкой из исходников на хосте (`make release` /
# `make deploy`, см. Makefile).
#
#   docker compose build api worker    # или TAG=v1.2.3 docker compose pull
#   docker compose run --rm migrate
#   docker compose up -d
#
# Секреты и настройки — .env.production (другой файл: ENV_FILE=...).
# Внешний Postgres (в т.ч. общий контейнер на этом же хосте): без
# docker-compose.postgres.yml, POSTGRES_HOST в .env.production (с хоста —
# host.docker.internal). Без docker-compose.s3.yml — STORAGE_DRIVER=local (том
# files) или внешний S3 через S3_*.
# Агент с воркерами echo и netprobe (agent/docker/Dockerfile): `docker compose --profile
# agent up -d`; регистрация — AGENT_BOOTSTRAP_TOKEN (тот же у API). Один агент — один том
# данных: ещё агенты — своими сервисами со своими томами. Несколько реплик api пересылают
# вызовы агентов друг другу (AGENT_RELAY_SECRET в .env.production) через внутренний сервер
# пересылки: порт AGENT_RELAY_PORT (8182) внутри сети compose, на хост не публикуется; адрес
# копии — http://<IP контейнера>:8182.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Общее для api, worker и migrate.
x-app: &app
  env_file: ${ENV_FILE:-.env.production}
  environment: &app-env
    NODE_ENV: production
    SERVER_HOST: 0.0.0.0
    TRUST_PROXY: "true"
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # Схему применяет только сервис migrate.
    DB_MIGRATIONS_RUN: "false"
    STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
    # Ссылки на файлы получают клиенты: публичный адрес хранилища (домен за
    # reverse proxy). По умолчанию — проброшенный порт на этом хосте.
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    S3_BUCKET: ${S3_BUCKET:-rest-api}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${S3_ROOT_ACCESS_KEY:-storage}}
    # Без ключей при STORAGE_DRIVER=s3 приложение не стартует (проверка конфига).
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${S3_ROOT_SECRET_KEY:-}}
    FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    # Куча V8 — ниже лимита памяти контейнера, иначе OOM-kill вместо GC.
    NODE_OPTIONS: --enable-source-maps --max-old-space-size=768
  # Сервисы хоста (общий Postgres, опубликованный на порту хоста).
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

x-ready-check: &ready-check
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:8181/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 60s

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  # Одноразовый: применяет миграции и выходит. api и worker ждут его успеха.
  migrate:
    <<: *app
    image: ${IMAGE:-ghcr.io/epifanovmd/rest-api-template-app}:${TAG:-latest}
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "build/data-source.js",
      ]
    restart: "no"

  api:
    <<: *app
    image: ${IMAGE:-ghcr.io/epifanovmd/rest-api-template-app}:${TAG:-latest}-api
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${TAG:-latest}
        AGENT_UPDATE_PUBLIC_KEY: ${AGENT_UPDATE_PUBLIC_KEY:-}
      secrets: [agent_signing_key]
    environment:
      <<: *app-env
      APP_ROLE: api
      # Сервер пересылки между репликами — только в сети compose (без ports).
      AGENT_RELAY_HOST: 0.0.0.0
      AGENT_RELAY_PORT: "8182"
    # Несколько реплик: `docker compose up -d --scale api=3` и диапазон
    # API_PORTS=8181-8183 (или без host-портов — за reverse proxy по имени `api`).
    ports:
      - "${API_PORTS:-8181}:8181"
    volumes:
      - files:/app/files
      # Ключ Firebase не входит в образ — монтируется только на чтение.
      # - ./firebaseAccount.json:/app/secrets/firebase.json:ro
    depends_on: *after-migrate
    # SIGTERM → drain + in-flight + закрытие БД (SHUTDOWN_TIMEOUT_MS=30s) — с запасом.
    stop_grace_period: 55s
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck: *ready-check
    restart: unless-stopped

  worker:
    <<: *app
    # Тот же образ использует migrate.
    image: ${IMAGE:-ghcr.io/epifanovmd/rest-api-template-app}:${TAG:-latest}
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${TAG:-latest}
        AGENT_UPDATE_PUBLIC_KEY: ${AGENT_UPDATE_PUBLIC_KEY:-}
      secrets: [agent_signing_key]
    environment:
      <<: *app-env
      APP_ROLE: worker
    volumes:
      - files:/app/files
    depends_on: *after-migrate
    # Активные задачи дорабатывают до JOBS_SHUTDOWN_TIMEOUT_MS (20s).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck: *ready-check
    restart: unless-stopped

  # Агент и воркеры без SDK (echo — очередь demo.echo, netprobe — проверка сети), по профилю.
  agent:
    profiles: ["agent"]
    image: ${IMAGE:-ghcr.io/epifanovmd/rest-api-template-app}:${TAG:-latest}-agent
    build:
      context: .
      dockerfile: agent/docker/Dockerfile
    environment:
      AGENT_SERVER_URL: ${AGENT_SERVER_URL:-http://api:8181}
      # Токен регистрации: bootstrap-токен API или выпущенный
      # (POST /api/v1/agent-enrollment-tokens).
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-${AGENT_BOOTSTRAP_TOKEN:-}}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
    volumes:
      # Ключ агента, очередь важных сообщений (события без связи), настройки
      # воркеров и ход работ echo переживают рестарт.
      - agent-data:/var/lib/agent
    depends_on:
      api:
        condition: service_healthy
    # Воркеры останавливаются вместе с агентом (stopTimeout в agent/docker/agent.yaml).
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

# Подпись воркеров проекта при сборке образа: закрытый ключ проекта — файлом
# AGENT_SIGNING_KEY_FILE на машине сборки (не в .env: env_file попадает в
# контейнеры), открытый ключ пары — AGENT_UPDATE_PUBLIC_KEY. Без файла воркеры
# без подписи.
secrets:
  agent_signing_key:
    file: ${AGENT_SIGNING_KEY_FILE:-/dev/null}

volumes:
  agent-data:
  files:
