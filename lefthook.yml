# Git-хуки: форматирование и линт застейдженных файлов, затем проверка типов и тесты;
# формат сообщения коммита — commit-msg.
pre-commit:
  parallel: false
  jobs:
    - name: prettier
      glob: "*.{ts,json,md,yml,yaml}"
      exclude:
        - "src/routing/swagger.json"
        - "src/routing/routes.ts"
      run: yarn prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob: "src/**/*.ts"
      exclude:
        - "src/routing/routes.ts"
        - "src/migrations/**"
      run: yarn eslint --fix {staged_files}
      stage_fixed: true

    - name: typecheck
      run: yarn typecheck

    - name: test
      run: yarn test

commit-msg:
  jobs:
    - name: conventional-commit
      run: node scripts/git/commit-msg.mjs {1}
