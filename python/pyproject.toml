[project]
name = "worker-sdk"
version = "1.0.0"
description = "SDK внешнего воркера очереди задач (HTTP API /api/v1/worker)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker_sdk"]
